version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: carelink
      MYSQL_USER: carelink_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./database/carelink_mysql_local.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '3306:3306'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PORT: 8000
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: carelink
      DB_USERNAME: carelink_user
      DB_PASSWORD: secret
    volumes:
      - ./backend:/var/www/html
    ports:
      - '8000:8000'
    command: sh -c "composer install --no-interaction --prefer-dist || true && php artisan key:generate --force || true && php artisan migrate --force || true && php artisan db:seed --force || true && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - '5173:5173'
    depends_on:
      - backend
    command: sh -c "npm install --legacy-peer-deps || true && npm run dev -- --host 0.0.0.0"

volumes:
  db_data:
